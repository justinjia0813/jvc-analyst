<g fill="#E6E9E3" class="cn" font-size="27" font-weight="650"><text x="126" y="610">× 混淆相邻赛道</text><text x="126" y="690">× 融资新闻当事实</text><text x="126" y="770">× 市场数字没口径</text><text x="126" y="850">× 曝光等于商业化</text><text x="126" y="930">× 直接回答投不投</text></g></g>
