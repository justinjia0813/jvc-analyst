<rect x="92" y="1062" width="896" height="120" fill="#F3F0E8"/><text x="124" y="1112" fill="#111419" class="cn" font-size="28" font-weight="850">差别不在写得更长，</text><text x="124" y="1152" fill="#111419" class="cn" font-size="28" font-weight="850">而在有没有可复核的研究纪律。</text>
