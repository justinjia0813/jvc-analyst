<svg width="1080" height="1440" viewBox="0 0 1080 1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="第一步不是搜索，是定研究口径">
<defs><pattern id="grid" width="90" height="120" patternUnits="userSpaceOnUse"><path d="M90 0H0V120" fill="none" stroke="#293038" stroke-width="1" opacity=".45"/></pattern><style>.cn{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;letter-spacing:0}.mono{font-family:Menlo,Monaco,Consolas,monospace;letter-spacing:0}</style></defs>
<rect width="1080" height="1440" fill="#0B0D10"/><rect width="1080" height="1440" fill="url(#grid)"/><rect x="54" y="54" width="972" height="1332" fill="none" stroke="#3A414C" stroke-width="2"/>
<rect x="78" y="78" width="924" height="76" fill="#171B21" stroke="#3A414C"/><text x="104" y="126" fill="#35D39A" class="mono" font-size="23" font-weight="800">STEP 01 / DEFINE</text><text x="956" y="126" fill="#A9B0AD" class="mono" font-size="23" font-weight="700" text-anchor="end">03 / 07</text>
<text x="92" y="280" fill="#F7F5EF" class="cn" font-size="66" font-weight="900">第一步不是搜索</text><text x="92" y="364" fill="#F7F5EF" class="cn" font-size="66" font-weight="900">是先定研究口径</text>
<g class="cn"><g><rect x="92" y="458" width="424" height="236" fill="#F3F0E8"/><text x="124" y="510" fill="#35A87B" class="mono" font-size="22" font-weight="900">01</text><text x="124" y="563" fill="#111419" font-size="31" font-weight="900">赛道定义</text><text x="124" y="610" fill="#68706B" font-size="24" font-weight="650">研究对象究竟是什么？</text><text x="124" y="646" fill="#68706B" font-size="24" font-weight="650">核心价值由什么创造？</text></g>
<g><rect x="564" y="458" width="424" height="236" fill="#F3F0E8"/><text x="596" y="510" fill="#35A87B" class="mono" font-size="22" font-weight="900">02</text><text x="596" y="563" fill="#111419" font-size="31" font-weight="900">排除边界</text><text x="596" y="610" fill="#68706B" font-size="24" font-weight="650">哪些相邻概念不纳入？</text><text x="596" y="646" fill="#68706B" font-size="24" font-weight="650">上下游边界在哪里？</text></g>
<g><rect x="92" y="726" width="424" height="236" fill="#F3F0E8"/><text x="124" y="778" fill="#35A87B" class="mono" font-size="22" font-weight="900">03</text><text x="124" y="831" fill="#111419" font-size="31" font-weight="900">时间 / 地域 / 阶段</text><text x="124" y="878" fill="#68706B" font-size="24" font-weight="650">看全球还是中国？</text><text x="124" y="914" fill="#68706B" font-size="24" font-weight="650">看科研还是商业放量？</text></g>
<g><rect x="564" y="726" width="424" height="236" fill="#F3F0E8"/><text x="596" y="778" fill="#35A87B" class="mono" font-size="22" font-weight="900">04</text><text x="596" y="831" fill="#111419" font-size="31" font-weight="900">术语消歧</text><text x="596" y="878" fill="#68706B" font-size="24" font-weight="650">中英文同义词是什么？</text><text x="596" y="914" fill="#68706B" font-size="24" font-weight="650">缩写是否一词多义？</text></g></g>
<rect x="92" y="1010" width="896" height="172" fill="#171B21" stroke="#35D39A" stroke-width="2"/><text x="124" y="1058" fill="#35D39A" class="mono" font-size="21" font-weight="850">DEFAULT WHEN SCOPE IS MISSING</text><text x="124" y="1112" fill="#E6E9E3" class="cn" font-size="27" font-weight="750">全球及中国市场 / 早期创业投资 / 未来 3-5 年</text><text x="124" y="1152" fill="#A9B0AD" class="cn" font-size="23" font-weight="650">所有默认假设会在报告开头明确写出。</text>
<rect x="78" y="1276" width="924" height="86" fill="#171B21" stroke="#3A414C"/><text x="104" y="1329" fill="#F7F5EF" class="mono" font-size="27" font-weight="800">JVC ANALYST</text><text x="956" y="1329" fill="#A9B0AD" class="mono" font-size="21" font-weight="700" text-anchor="end">SCOPE BEFORE SEARCH</text>
</svg>

