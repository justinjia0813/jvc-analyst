<svg width="1080" height="1440" viewBox="0 0 1080 1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="数据不只找，还要互证">
<defs><pattern id="grid" width="90" height="120" patternUnits="userSpaceOnUse"><path d="M90 0H0V120" fill="none" stroke="#293038" stroke-width="1" opacity=".45"/></pattern><style>.cn{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;letter-spacing:0}.mono{font-family:Menlo,Monaco,Consolas,monospace;letter-spacing:0}</style></defs>
<rect width="1080" height="1440" fill="#0B0D10"/><rect width="1080" height="1440" fill="url(#grid)"/><rect x="54" y="54" width="972" height="1332" fill="none" stroke="#3A414C" stroke-width="2"/>
<rect x="78" y="78" width="924" height="76" fill="#171B21" stroke="#3A414C"/><text x="104" y="126" fill="#35D39A" class="mono" font-size="23" font-weight="800">STEP 03 / VERIFY</text><text x="956" y="126" fill="#A9B0AD" class="mono" font-size="23" font-weight="700" text-anchor="end">05 / 07</text>
<text x="92" y="280" fill="#F7F5EF" class="cn" font-size="66" font-weight="900">数据不只找</text><text x="92" y="364" fill="#F7F5EF" class="cn" font-size="66" font-weight="900">还要互证</text>
<g class="cn"><rect x="92" y="448" width="896" height="140" fill="#F3F0E8"/><rect x="92" y="448" width="12" height="140" fill="#35D39A"/><text x="126" y="500" fill="#111419" font-size="28" font-weight="900">市场数据</text><text x="326" y="500" fill="#68706B" font-size="23" font-weight="650">至少两类来源；无法互证就标「未核实」</text><text x="126" y="548" fill="#68706B" font-size="22" font-weight="650">市场空间 / 增速 / 渗透率 / 价格 / 出货量</text>
<rect x="92" y="610" width="896" height="188" fill="#171B21" stroke="#35D39A"/><text x="126" y="662" fill="#35D39A" font-size="28" font-weight="900">技术里程碑</text><text x="126" y="720" fill="#E6E9E3" class="mono" font-size="22" font-weight="800">实验 → 样机 → 试点 → 客户试用 → 收入 → 规模交付</text><text x="126" y="762" fill="#A9B0AD" font-size="22" font-weight="650">每一步都不是同一件事，不能混写成“已经商业化”。</text>
<rect x="92" y="820" width="896" height="140" fill="#F3F0E8"/><rect x="92" y="820" width="12" height="140" fill="#F1B85B"/><text x="126" y="872" fill="#111419" font-size="28" font-weight="900">玩家状态</text><text x="326" y="872" fill="#68706B" font-size="23" font-weight="650">上市 / 成熟 / 成长 / 早期 / 实验室</text><text x="126" y="920" fill="#68706B" font-size="22" font-weight="650">融资额不等于技术领先，媒体曝光不等于规模交付。</text>
<rect x="92" y="982" width="896" height="140" fill="#F3F0E8"/><rect x="92" y="982" width="12" height="140" fill="#FF6B5E"/><text x="126" y="1034" fill="#111419" font-size="28" font-weight="900">政策状态</text><text x="326" y="1034" fill="#68706B" font-size="23" font-weight="650">已生效 / 征求意见 / 地方扶持 / 产业口号</text><text x="126" y="1082" fill="#68706B" font-size="22" font-weight="650">政策热度和真实采购，必须分开判断。</text></g>
<rect x="78" y="1276" width="924" height="86" fill="#171B21" stroke="#3A414C"/><text x="104" y="1329" fill="#F7F5EF" class="mono" font-size="27" font-weight="800">JVC ANALYST</text><text x="956" y="1329" fill="#A9B0AD" class="mono" font-size="21" font-weight="700" text-anchor="end">TRACE EVERY CLAIM</text>
</svg>

