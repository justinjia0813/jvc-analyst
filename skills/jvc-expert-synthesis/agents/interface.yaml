interface:
  display_name: "多方访谈交叉比对"
  short_description: "多场访谈按议题比对共识、分歧与立场偏差，生成下一轮问题"
  default_prompt: "使用 jvc-expert-synthesis 处理提供的多份访谈纪要，交付结论在前、原话可回查、分歧写明谁更可信的交叉比对。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "claude", "generic"]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-directory"
    claude: "native-skill-directory"
    generic: "neutral-source-with-sibling-core"
