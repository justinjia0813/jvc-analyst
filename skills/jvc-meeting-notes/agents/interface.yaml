interface:
  display_name: "访谈纪要"
  short_description: "把逐字稿和随笔整理成带三项自查和待验证点的 Word 纪要"
  default_prompt: "使用 jvc-meeting-notes 处理提供的材料，交付结论在前、依据在附录、可直接转发的访谈纪要。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "claude", "generic"]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-directory"
    claude: "native-skill-directory"
    generic: "neutral-source-with-sibling-core"
