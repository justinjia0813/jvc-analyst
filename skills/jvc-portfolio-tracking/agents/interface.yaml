interface:
  display_name: "投后跟踪"
  short_description: "被投公司季度简报与投后仪表板更新"
  default_prompt: "使用 jvc-portfolio-tracking 处理提供的材料，逐月核对可用现金、资本开支和还款，把未到账融资单列情景，交付季度简报与跟进问题。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "claude", "generic"]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-directory"
    claude: "native-skill-directory"
    generic: "neutral-source-with-sibling-core"
