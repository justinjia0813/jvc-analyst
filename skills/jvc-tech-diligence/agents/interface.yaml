interface:
  display_name: "技术尽调"
  short_description: "拆解技术宣称，原理判断、对标最优水平、找量产障碍和该问的技术问题"
  default_prompt: "使用 jvc-tech-diligence 处理提供的技术材料，交付判断在前、参数对标清楚、测试条件写明、依据在附录的技术尽调。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "claude", "generic"]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-directory"
    claude: "native-skill-directory"
    generic: "neutral-source-with-sibling-core"
