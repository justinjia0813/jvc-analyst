interface:
  display_name: "建模工作簿"
  short_description: "市场规模、可比公司、投资回报 Excel 模型"
  default_prompt: "使用 jvc-workbook 处理提供的材料，完成实际重算、业务勾稽和输入变化检查，交付带公式的工作簿与一页结论。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "claude", "generic"]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "native-skill-directory"
    claude: "native-skill-directory"
    generic: "neutral-source-with-sibling-core"
